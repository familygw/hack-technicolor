<span class="chip" [ngClass]="{'connected': !!this.connected, 'connecting': !!this.connecting}"></span>
@if (!this.connected && !this.connecting) {
  <span>Sin conexión</span>
}
@if (!this.connecting && !!this.connected) {
  <span>Conectado</span>
}
@if (!!this.connecting) {
  <span>Conectando...</span>
}
